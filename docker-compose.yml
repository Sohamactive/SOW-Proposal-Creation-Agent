services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      EXPORT_FOLDER: /app/generated_proposals
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./generated_proposals:/app/generated_proposals
      - ./backend/sample_docs:/app/backend/sample_docs